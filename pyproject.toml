[project]
name = "school-notes"
version = "0.1.0"
description = "Messy school notes in, clean PDF out: LLM structuring + deterministic LaTeX rendering."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
ui = ["PySide6>=6.8"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
school-notes = "notes_app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notes_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real LLM backend (opt-in: pytest -m live)"]
addopts = "-m 'not live'"
