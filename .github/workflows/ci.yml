name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XeLaTeX and Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-czechslovak texlive-science \
            texlive-pictures texlive-latex-extra texlive-plain-generic lmodern \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - uses: astral-sh/setup-uv@v6

      - name: Run tests (Qt headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the full history with gitleaks
        run: |
          v=8.30.1
          base=https://github.com/gitleaks/gitleaks/releases/download/v$v
          curl -sSLO $base/gitleaks_${v}_linux_x64.tar.gz
          curl -sSLO $base/gitleaks_${v}_checksums.txt
          grep linux_x64.tar.gz gitleaks_${v}_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_${v}_linux_x64.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --verbose .
